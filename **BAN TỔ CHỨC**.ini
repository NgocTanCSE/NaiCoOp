**ĐỀ THI CHÍNH THỨC**  
*(04 trang đề và 01 Phiếu chọn đề)*

---

**ĐỀ THI VÒNG SƠ LOẠI**  
**Cuộc thi Hackathon thành phố Đồng Nai năm 2026**  
*Nội dung: Thiết kế trải nghiệm và giao diện người dùng (UX/UI)*  
*Thời gian làm bài: 07 giờ (từ 08 giờ 00 đến 15 giờ 00, ngày 24/11/2026)*  
-----

**I. YÊU CẦU CHUNG**

- Mỗi đội **chọn 01 trong 04 đề** dưới đây, ghi số đề đã chọn vào **Phiếu chọn đề** và nộp cho giám sát phòng thi **trước 08 giờ 30**; sau thời điểm này không được đổi đề.
- Vòng sơ loại chỉ yêu cầu **thiết kế giao diện và luồng sử dụng**, chưa yêu cầu lập trình hoàn chỉnh. 15 đội có điểm cao nhất vào Vòng chung kết sẽ **hiện thực hóa chính sản phẩm đã thiết kế** trong 24 giờ, vì vậy thiết kế cần vừa sức thực hiện.
- Được dùng mọi công cụ thiết kế (Figma, Canva, Penpot, Adobe XD...), tài liệu và công cụ trí tuệ nhân tạo; **phải ghi rõ công cụ trí tuệ nhân tạo đã dùng vào việc gì** trong bản thuyết minh. Không sao chép nguyên giao diện của sản phẩm có sẵn.
- Dữ liệu trong đề là **dữ liệu giả lập** để thiết kế; các đội được tự bổ sung dữ liệu mẫu hợp lý. Không dùng thông tin cá nhân thật của người khác.
- Không trao đổi bài giữa các đội; thí sinh ra, vào khu thi phải báo giám sát.

**II. SẢN PHẨM NỘP (đúng 15 giờ 00, nộp trực tiếp cho Tổ Thư ký)**

| TT | Sản phẩm | Yêu cầu |
| :--- | :--- | :--- |
| 1 | Bản thiết kế giao diện | Tệp PDF xuất từ công cụ thiết kế, tối thiểu đủ các màn hình bắt buộc của đề đã chọn; đặt tên màn hình rõ ràng. |
| 2 | Bản mẫu bấm được (prototype) – khuyến khích | Tệp prototype hoặc đường dẫn ghi trong bản thuyết minh, thể hiện trọn **01 luồng chính** của đề; đội trình chiếu thử trên máy của đội khi Ban Giám khảo yêu cầu. |
| 3 | Bản thuyết minh (tối đa 03 trang) | (a) Vấn đề và người dùng; (b) luồng sử dụng chính; (c) danh sách tính năng sẽ làm trong 24 giờ nếu vào chung kết (phạm vi tối thiểu – MVP); (d) kiến trúc, công nghệ dự kiến; (e) công cụ trí tuệ nhân tạo đã dùng. |

**Cách nộp:** mỗi đội để toàn bộ sản phẩm trong 01 thư mục đặt tên **Doi[mã đội]_De[số đề]** (ví dụ: Doi13_De2) trên màn hình máy tính. Đúng 15 giờ 00, các đội dừng làm bài; Tổ Thư ký đến từng bàn sao chép thư mục vào ổ lưu trữ của Ban Tổ chức, đội trưởng ký Biên bản nộp bài. Không chỉnh sửa bài sau 15 giờ 00. Các đội nên lưu bài thường xuyên để tránh mất dữ liệu.

**III. TIÊU CHÍ CHẤM (thang điểm 100)**

| TT | Tiêu chí | Điểm | Nội dung đánh giá |
| :--- | :--- | :---: | :--- |
| 1 | Hiểu vấn đề và người dùng | 25 | Xác định đúng người dùng, nỗi đau, bối cảnh sử dụng tại Đồng Nai; luồng chính giải quyết được vấn đề của đề. |
| 2 | Thiết kế giải pháp (UX/UI) | 30 | Luồng sử dụng hợp lý, ít bước; giao diện rõ ràng, nhất quán, dễ đọc trên điện thoại; xử lý các trường hợp lỗi, trạng thái trống; phù hợp đối tượng (người cao tuổi, học sinh, cán bộ cơ sở...). |
| 3 | Tính sáng tạo | 20 | Cách tiếp cận mới, ứng dụng hợp lý dữ liệu, bản đồ, trí tuệ nhân tạo; không sao chép. |
| 4 | Tính khả thi, tác động | 25 | Phạm vi làm được trong 24 giờ; kiến trúc, công nghệ dự kiến phù hợp; khả năng triển khai thật tại xã, phường, trường học. |

*Trường hợp bằng điểm, xếp hạng theo thứ tự ưu tiên: tiêu chí 2, tiêu chí 4. Đội không nộp sản phẩm số 1 và số 3 không được xét vào Vòng chung kết.*

**IV. NỘI DUNG 04 ĐỀ**

**ĐỀ 1 – ĐOÀN VIÊN SỐ (Chuyển đổi số trong công tác Đoàn)**

**Bối cảnh:** Thành phố Đồng Nai có 95 xã, phường và hàng nghìn chi đoàn. Bí thư chi đoàn khu phố, ấp phần lớn kiêm nhiệm, quản lý đoàn viên bằng sổ giấy và nhóm Zalo; điểm danh sinh hoạt, tổng hợp số liệu báo cáo hằng tháng mất nhiều thời gian; đoàn viên đi làm ăn xa khó theo dõi.

**Người dùng:** (1) Bí thư chi đoàn – 27 tuổi, dùng điện thoại là chính; (2) Đoàn viên – công nhân khu công nghiệp, làm ca; (3) Cán bộ Đoàn xã, phường – cần số liệu toàn xã để báo cáo.

**Màn hình bắt buộc (tối thiểu 06):** đăng nhập theo vai trò; trang chủ chi đoàn (số đoàn viên, hoạt động sắp tới); tạo buổi sinh hoạt và mã QR điểm danh; đoàn viên quét QR điểm danh, xem lịch sử tham gia; danh sách đoàn viên có bộ lọc (đang ở địa phương, đi làm xa, chuyển sinh hoạt); trang tổng hợp của Đoàn xã, phường (tỷ lệ sinh hoạt từng chi đoàn, xuất báo cáo tháng).

**Điểm cộng:** đoàn viên làm ca chọn buổi sinh hoạt bù; nhắc lịch tự động; tích điểm thi đua từ hoạt động tình nguyện.

*Dữ liệu mẫu: Chi đoàn Khu phố 5 – 46 đoàn viên (31 ở địa phương, 12 đi làm xa, 3 chuyển sinh hoạt); 03 buổi sinh hoạt gần nhất có 28, 19, 33 người tham dự.*

**ĐỀ 2 – PHẢN ÁNH HIỆN TRƯỜNG (Chính quyền số – đô thị thông minh)**

**Bối cảnh:** Người dân gặp đèn đường hỏng, ổ gà, ngập nước sau mưa, rác thải tự phát nhưng không biết báo ai, báo xong không biết đã được xử lý chưa. Ủy ban nhân dân phường cần tiếp nhận tập trung, giao đúng bộ phận và công khai kết quả.

**Người dùng:** (1) Người dân – kể cả người cao tuổi ít dùng công nghệ; (2) Cán bộ tiếp nhận của phường; (3) Đội thanh niên tình nguyện hỗ trợ xác minh tại chỗ.

**Màn hình bắt buộc (tối thiểu 06):** gửi phản ánh trong 03 bước (chụp ảnh – vị trí trên bản đồ – chọn loại); theo dõi trạng thái phản ánh của tôi; bản đồ các phản ánh quanh tôi; màn hình cán bộ tiếp nhận: danh sách, phân loại, giao xử lý, hạn xử lý; cập nhật kết quả kèm ảnh sau xử lý; người dân đánh giá mức độ hài lòng.

**Điểm cộng:** gợi ý phân loại tự**BAN TỔ CHỨC**  
**CUỘC THI HACKATHON**  
