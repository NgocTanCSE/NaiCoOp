**IV. NỘI DUNG 04 ĐỀ**

**ĐỀ 1 – ĐOÀN VIÊN SỐ (Chuyển đổi số trong công tác Đoàn)**

**Bối cảnh:** Thành phố Đồng Nai có 95 xã, phường và hàng nghìn chi đoàn. Bí thư chi đoàn khu phố, ấp phần lớn kiêm nhiệm, quản lý đoàn viên bằng sổ giấy và nhóm Zalo; điểm danh sinh hoạt, tổng hợp số liệu báo cáo hằng tháng mất nhiều thời gian; đoàn viên đi làm ăn xa khó theo dõi.

**Người dùng:** (1) Bí thư chi đoàn – 27 tuổi, dùng điện thoại là chính; (2) Đoàn viên – công nhân khu công nghiệp, làm ca; (3) Cán bộ Đoàn xã, phường – cần số liệu toàn xã để báo cáo.

**Màn hình bắt buộc (tối thiểu 06):** đăng nhập theo vai trò; trang chủ chi đoàn (số đoàn viên, hoạt động sắp tới); tạo buổi sinh hoạt và mã QR điểm danh; đoàn viên quét QR điểm danh, xem lịch sử tham gia; danh sách đoàn viên có bộ lọc (đang ở địa phương, đi làm xa, chuyển sinh hoạt); trang tổng hợp của Đoàn xã, phường (tỷ lệ sinh hoạt từng chi đoàn, xuất báo cáo tháng).

**Điểm cộng:** đoàn viên làm ca chọn buổi sinh hoạt bù; nhắc lịch tự động; tích điểm thi đua từ hoạt động tình nguyện.

*Dữ liệu mẫu: Chi đoàn Khu phố 5 – 46 đoàn viên (31 ở địa phương, 12 đi làm xa, 3 chuyển sinh hoạt); 03 buổi sinh hoạt gần nhất có 28, 19, 33 người tham dự.*

**ĐỀ 2 – PHẢN ÁNH HIỆN TRƯỜNG (Chính quyền số – đô thị thông minh)**

**Bối cảnh:** Người dân gặp đèn đường hỏng, ổ gà, ngập nước sau mưa, rác thải tự phát nhưng không biết báo ai, báo xong không biết đã được xử lý chưa. Ủy ban nhân dân phường cần tiếp nhận tập trung, giao đúng bộ phận và công khai kết quả.

**Người dùng:** (1) Người dân – kể cả người cao tuổi ít dùng công nghệ; (2) Cán bộ tiếp nhận của phường; (3) Đội thanh niên tình nguyện hỗ trợ xác minh tại chỗ.

**Màn hình bắt buộc (tối thiểu 06):** gửi phản ánh trong 03 bước (chụp ảnh – vị trí trên bản đồ – chọn loại); theo dõi trạng thái phản ánh của tôi; bản đồ các phản ánh quanh tôi; màn hình cán bộ tiếp nhận: danh sách, phân loại, giao xử lý, hạn xử lý; cập nhật kết quả kèm ảnh sau xử lý; người dân đánh giá mức độ hài lòng.

**Điểm cộng:** gợi ý phân loại tự động từ ảnh bằng trí tuệ nhân tạo; gộp các phản ánh trùng vị trí; chế độ chữ lớn cho người cao tuổi.

*Dữ liệu mẫu: Phường Trấn Biên, tháng 11/2026: 64 phản ánh (đèn đường 18, ngập nước 15, rác thải 21, mặt đường 10); 47 đã xử lý, thời gian xử lý trung bình 3,2 ngày.*

**ĐỀ 3 – CHỢ OCOP THANH NIÊN (Kinh tế số – thương mại điện tử – khởi nghiệp)**

**Bối cảnh:** Nhiều chủ thể OCOP, nhà vườn của Đồng Nai có sản phẩm tốt (chôm chôm, sầu riêng Long Khánh, bưởi Tân Triều, hạt điều, cà phê...) nhưng chưa biết bán hàng trực tuyến, chưa có nhật ký sản xuất, khách hàng khó kiểm chứng nguồn gốc. Đoàn viên, thanh niên có thể làm “cầu nối số” hỗ trợ nhà vườn.

**Người dùng:** (1) Chủ nhà vườn 50 tuổi; (2) Thanh niên hỗ trợ số – chụp ảnh, đăng sản phẩm, livestream; (3) Khách hàng ở thành phố Hồ Chí Minh đặt mua.

**Màn hình bắt buộc (tối thiểu 06):** hồ sơ nhà vườn (câu chuyện, vị trí, chứng nhận OCOP); đăng sản phẩm nhanh bằng ảnh và giọng nói; trang sản phẩm có mã QR truy xuất nguồn gốc (nhật ký mùa vụ); giỏ hàng, đặt hàng, chọn hình thức nhận hàng; quản lý đơn hàng của nhà vườn; lịch livestream bán hàng của thanh niên hỗ trợ.

**Điểm cộng:** trí tuệ nhân tạo viết mô tả sản phẩm từ ảnh; bản đồ nhà vườn kết hợp du lịch trải nghiệm; ghi nhận số giờ tình nguyện của thanh niên hỗ trợ.

*Dữ liệu mẫu: Nhà vườn Ba Tư (giả lập) – 2,5 ha chôm chôm, sầu riêng tại Long Khánh; 05 sản phẩm, giá 35.000 – 120.000 đồng/kg; 02 đoàn viên hỗ trợ.*

**ĐỀ 4 – LÁ CHẮN SỐ (An toàn thông tin – phòng, chống lừa đảo – kỹ năng số)**

**Bối cảnh:** Lừa đảo qua điện thoại, tin nhắn, đường dẫn giả mạo, tài khoản mạo danh cơ quan công an, ngân hàng ngày càng tinh vi; người cao tuổi và học sinh là nhóm dễ bị tổn thương. Cần một công cụ giúp kiểm tra nhanh trước khi chuyển tiền và học kỹ năng nhận diện.

**Người dùng:** (1) Người cao tuổi 65 tuổi – nhận cuộc gọi lạ; (2) Học sinh trung học phổ thông – nhận tin nhắn “việc nhẹ lương cao”; (3) Đội thanh niên tình nguyện tuyên truyền tại xã, phường.

**Màn hình bắt buộc (tối thiểu 06):** kiểm tra nhanh số điện thoại, đường dẫn, số tài khoản (kết quả: an toàn – nghi ngờ – nguy hiểm, kèm lý do dễ hiểu); báo cáo một trường hợp lừa đảo; nút “Hỏi người thân” gửi nhanh cho người được chỉ định trước; bài học ngắn 01 phút theo tình huống; bài kiểm tra nhận diện lừa đảo có chấm điểm; màn hình đội tình nguyện: thống kê các kiểu lừa đảo mới tại địa phương.

**Điểm cộng:** trí tuệ nhân tạo phân tích nội dung tin nhắn dán vào; chế độ giọng nói cho người cao tuổi; kết nối kênh tiếp nhận tin báo của Công an.

*Dữ liệu mẫu: 10 tình huống lừa đảo phổ biến (giả danh công an yêu cầu chuyển tiền; đường dẫn nhận quà tri ân; tuyển cộng tác viên đặt đơn; người thân gặp tai nạn cần tiền gấp...); 120 lượt báo cáo trong tháng, 35% là đường dẫn giả mạo.*

--- HẾT ---

*Thí sinh không được sử dụng tài liệu trao đổi giữa các đội. Giám sát không giải thích gì thêm về nội dung đề.* động từ ảnh bằng trí tuệ nhân tạo; gộp các phản ánh trùng vị trí; chế độ chữ lớn cho người cao tuổi.

*Dữ liệu mẫu: Phường Trấn Biên, tháng 11/2026: 64 phản ánh (đèn đường 18, ngập nước 15, rác thải 21, mặt đường 10); 47 đã xử lý, thời gian xử lý trung bình 3,2 ngày.*

**ĐỀ 3 – CHỢ OCOP THANH NIÊN (Kinh tế số – thương mại điện tử – khởi nghiệp)**

**Bối cảnh:** Nhiều chủ thể OCOP, nhà vườn của Đồng Nai có sản phẩm tốt (chôm chôm, sầu riêng Long Khánh, bưởi Tân Triều, hạt điều, cà phê...) nhưng chưa biết bán hàng trực tuyến, chưa có nhật ký sản xuất, khách hàng khó kiểm chứng nguồn gốc. Đoàn viên, thanh niên có thể làm “cầu nối số” hỗ trợ nhà vườn.

**Người dùng:** (1) Chủ nhà vườn 50 tuổi; (2) Thanh niên hỗ trợ số – chụp ảnh, đăng sản phẩm, livestream; (3) Khách hàng ở thành phố Hồ Chí Minh đặt mua.

**Màn hình bắt buộc (tối thiểu 06):** hồ sơ nhà vườn (câu chuyện, vị trí, chứng nhận OCOP); đăng sản phẩm nhanh bằng ảnh và giọng nói; trang sản phẩm có mã QR truy xuất nguồn gốc (nhật ký mùa vụ); giỏ hàng, đặt hàng, chọn hình thức nhận hàng; quản lý đơn hàng của nhà vườn; lịch livestream bán hàng của thanh niên hỗ trợ.

**Điểm cộng:** trí tuệ nhân tạo viết mô tả sản phẩm từ ảnh; bản đồ nhà vườn kết hợp du lịch trải nghiệm; ghi nhận số giờ tình nguyện của thanh niên hỗ trợ.

*Dữ liệu mẫu: Nhà vườn Ba Tư (giả lập) – 2,5 ha chôm chôm, sầu riêng tại Long Khánh; 05 sản phẩm, giá 35.000 – 120.000 đồng/kg; 02 đoàn viên hỗ trợ.*

