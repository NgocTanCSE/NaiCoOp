# Cấu hình Supabase CLI cho dự án cục bộ (tuỳ chọn).
# `supabase start` để chạy toàn bộ stack tại máy; `supabase db push` để đẩy migration lên dự án đám mây.
project_id = "naifarm"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "5MiB"
